<!-- Single Project Card Component -->
<div class="col-md-6 col-lg-4 mb-4">
    <div class="project-card bg-white rounded-4 overflow-hidden">
        <img src="{{image}}" class="card-img-top" alt="{{imageAlt}}">

        <div class="project-card-body p-4 p-md-5">
            
            <!-- Title -->
            <h5 class="project-title fw-bold mb-2">{{title}}</h5>
            
            <!-- Description -->
            <p class="project-description text-muted mb-2">{{description}}</p>
            
            <!-- CTA Link -->
            {{cta}}
        </div>

    </div>
</div>
