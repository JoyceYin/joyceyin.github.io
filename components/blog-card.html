

<div class="row justify-content-center">
    <div class="col-10 mb-4">
        <!-- Your Card -->
        <div class="card-modern rounded-4 overflow-hidden bg-white">
            <div class="row g-0">
                <!-- Image on Left -->
                <div class="col-md-3">
                    <img src="{{image}}" alt="{{imageAlt}}" class="img-fluid h-100 w-100" style="object-fit: cover; min-height: 200px;">
                </div>
                
                <!-- Content on Right -->
                <div class="col-md-9">
                    <div class="card-body p-4">
                        <span class="badge bg-success mb-2 px-3 py-2">{{badge}}</span>
                        <h5 class="card-title fw-bold mb-2">{{title}}</h5>
                        <p class="card-text text-muted mb-2">{{description}}</p>
                        <a href="{{link}}" class="card-link">
                            {{ctaText}} <span class="arrow">→</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
